# Pre-commit hooks for android-emulator-skill
# Install: pre-commit install && pre-commit install --hook-type commit-msg
#   (the second is required for the trailer check; commit-msg is not installed
#    by `pre-commit install` alone)
# Run manually: pre-commit run --all-files

repos:
  # Black - Code formatter
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        name: Format Python code with Black
        language_version: python3.12
        files: ^android-emulator-skill/skills/android-emulator-skill/scripts/.*\.py$

  # Ruff - Fast linter (replaces Flake8, isort, etc)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        name: Lint with Ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^android-emulator-skill/skills/android-emulator-skill/scripts/.*\.py$

  # General file checks.
  #
  # The three hooks that REWRITE files skip recorded fixture payloads. Those are
  # tool output kept byte for byte, and "fixing" their whitespace makes them
  # something no tool printed: avdmanager pads its progress lines and ends
  # `delete avd` with no newline, and seven older fixtures carry trailing
  # whitespace the device really sent. identify also classes
  # am_profile_hang.trace as text (its first ~10 KB is), so these hooks would
  # rewrite bytes inside its binary record stream. Only the payloads are
  # excluded: MANIFEST.json, and anything else in that tree, stays under every
  # hook, and the checking hooks still see the payloads too.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        exclude: ^tests/fixtures/recorded/.*\.(txt|xml|trace|png)$
      - id: end-of-file-fixer
        name: Fix end of files
        exclude: ^tests/fixtures/recorded/.*\.(txt|xml|trace|png)$
      - id: check-yaml
        name: Check YAML syntax
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=500']
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: ['--fix=lf']
        exclude: ^tests/fixtures/recorded/.*\.(txt|xml|trace|png)$

  # Commit messages end at their last content line: no Co-Authored-By, no
  # Signed-off-by, no generated-with footer. A hook rather than a note in the
  # style guide because adding Co-Authored-By is a *default* in several tools,
  # so it comes back on its own -- and something that reapplies itself needs a
  # check that reapplies itself too.
  - repo: local
    hooks:
      - id: no-commit-trailers
        name: Reject commit-message trailers
        entry: python3 .github/scripts/check-commit-trailers.py
        language: system
        stages: [commit-msg]
