name: Run Tests

# Deliberately NO `paths:` filter: this workflow's job is a REQUIRED status
# check on main, and GitHub never reports a filtered-out workflow as skipped --
# it stays "Expected" and the pull request is blocked forever. See
# tests/test_packaging_contract.py::test_no_required_check_filters_by_path.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run pytest (mocked, no device required)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow pyyaml

      - name: Run pytest
        run: |
          echo "🧪 Running unit tests (adb/subprocess mocked)..."
          pytest tests/
