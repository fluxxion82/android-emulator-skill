name: Run Tests

# Deliberately NO `paths:` filter: this workflow's job is a REQUIRED status
# check on main, and GitHub never reports a filtered-out workflow as skipped --
# it stays "Expected" and the pull request is blocked forever. See
# tests/test_packaging_contract.py::test_no_required_check_filters_by_path.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Run pytest (mocked, no device required)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: dev-constraints.txt

      - name: Install test dependencies
        # Versions come from dev-constraints.txt and nowhere else: packages are
        # named bare here. Guarded by tests/test_packaging_contract.py::
        # test_every_workflow_install_takes_its_version_from_the_shared_pins.
        run: |
          python -m pip install -c dev-constraints.txt pip
          pip install -c dev-constraints.txt pytest pillow pyyaml

      - name: Run pytest
        run: |
          echo "🧪 Running unit tests (adb/subprocess mocked)..."
          pytest tests/
