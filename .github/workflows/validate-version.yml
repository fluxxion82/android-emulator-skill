name: Validate Version

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (e.g., v1.0.0)'
        required: true
        type: string

# The token GitHub hands each job may read the repository and no more.
# tests/test_release_artifact.py holds that for every workflow here: a release
# asset is written with `contents: write`, and one job of release.yml has it.
permissions:
  contents: read

jobs:
  validate:
    name: Validate version consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the five versioned files
        # Each is read at the place its format gives the version, by the script
        # the release's own gate runs; it needs nothing installed. The tag and
        # the typed version reach the shell as variables, never as its text:
        # an expression written into a script is run as part of it.
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          TYPED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "release" ]; then version="$TAG"; else version="$TYPED"; fi
          python3 tests/check_versions.py "${version#v}" | tee -a "$GITHUB_STEP_SUMMARY"
