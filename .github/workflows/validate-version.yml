name: Validate Version

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to validate (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  validate:
    name: Validate version consistency
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi

          # Remove 'v' prefix if present
          VERSION_NUMBER="${VERSION#v}"

          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "number=$VERSION_NUMBER" >> $GITHUB_OUTPUT
          echo "📌 Validating version: $VERSION (number: $VERSION_NUMBER)"

      - name: Check pyproject.toml version
        run: |
          PYPROJECT_VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "pyproject.toml version: $PYPROJECT_VERSION"
          echo "Release version: ${{ steps.version.outputs.number }}"

          if [ "$PYPROJECT_VERSION" != "${{ steps.version.outputs.number }}" ]; then
            echo "❌ ERROR: Version mismatch!"
            echo "  pyproject.toml: $PYPROJECT_VERSION"
            echo "  Release tag: ${{ steps.version.outputs.number }}"
            exit 1
          fi
          echo "✅ pyproject.toml version matches"

      - name: Check SKILL.md frontmatter version
        run: |
          SKILL_MD=android-emulator-skill/skills/android-emulator-skill/SKILL.md
          SKILL_VERSION=$(grep -E '^version: ' "$SKILL_MD" | head -1 | sed 's/version: //')
          echo "SKILL.md version: $SKILL_VERSION"
          if [ "$SKILL_VERSION" != "${{ steps.version.outputs.number }}" ]; then
            echo "::error::SKILL.md says $SKILL_VERSION, release is ${{ steps.version.outputs.number }}"
            exit 1
          fi
          echo "SKILL.md version matches"

      - name: Check plugin.json version
        run: |
          PLUGIN_JSON=android-emulator-skill/.claude-plugin/plugin.json
          PLUGIN_VERSION=$(python3 -c "import json;print(json.load(open('$PLUGIN_JSON')).get('version',''))")
          echo "plugin.json version: $PLUGIN_VERSION"
          if [ "$PLUGIN_VERSION" != "${{ steps.version.outputs.number }}" ]; then
            echo "::error::plugin.json says '$PLUGIN_VERSION', release is ${{ steps.version.outputs.number }}"
            exit 1
          fi
          echo "plugin.json version matches"

      - name: Check marketplace.json version
        run: |
          MARKET_JSON=.claude-plugin/marketplace.json
          MARKET_VERSION=$(python3 -c "import json;print(json.load(open('$MARKET_JSON'))['plugins'][0].get('version',''))")
          echo "marketplace.json version: $MARKET_VERSION"
          if [ "$MARKET_VERSION" != "${{ steps.version.outputs.number }}" ]; then
            echo "::error::marketplace.json says '$MARKET_VERSION', release is ${{ steps.version.outputs.number }}"
            exit 1
          fi
          echo "marketplace.json version matches"

      - name: Validation summary
        if: success()
        run: |
          echo "## ✅ Version Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Version:** ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All version references are consistent:" >> $GITHUB_STEP_SUMMARY
          echo "- pyproject.toml: ${{ steps.version.outputs.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- SKILL.md: ${{ steps.version.outputs.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- plugin.json: ${{ steps.version.outputs.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- marketplace.json: ${{ steps.version.outputs.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Git tag: ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
