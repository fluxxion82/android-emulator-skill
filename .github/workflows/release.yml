name: Package and Release Skill

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # A release used to run ZERO tests: it checked that three files existed,
  # zipped, and uploaded. The checks that decide whether this skill works were
  # not on the path that ships -- which is the same process shape that once let
  # three advertised capabilities ship completely inert behind 470 passing
  # tests. Both jobs below are required before anything is packaged.
  verify:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow pyyaml 'black==26.5.1' 'ruff==0.15.14'

      - name: Ruff
        run: ruff check android-emulator-skill/skills/android-emulator-skill/scripts/ tests/

      - name: Black
        run: black --check --diff android-emulator-skill/skills/android-emulator-skill/scripts/ tests/

      - name: Unit tests
        run: pytest tests/ -q

  # The device-backed lane. A fixture freezes one moment of output; it cannot
  # catch asynchrony, blocking, concurrency, or a gesture whose direction is
  # backwards. Those have to be run against a real device or they are not
  # tested at all.
  emulator:
    name: Emulator lane
    uses: ./.github/workflows/emulator.yml

  package:
    name: Package skill and upload to release
    runs-on: ubuntu-latest
    needs: [verify, emulator]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate skill structure
        run: |
          echo "Validating android-emulator-skill/ package structure..."
          test -f android-emulator-skill/.claude-plugin/plugin.json || { echo "ERROR: plugin.json not found"; exit 1; }
          test -f android-emulator-skill/skills/android-emulator-skill/SKILL.md || { echo "ERROR: SKILL.md not found"; exit 1; }
          test -d android-emulator-skill/skills/android-emulator-skill/scripts || { echo "ERROR: scripts directory not found"; exit 1; }
          echo "✅ Skill structure validated successfully"

      - name: Create skill package
        run: |
          cd android-emulator-skill
          zip -r ../android-emulator-skill-${{ github.ref_name }}.zip . \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x "*.DS_Store"
          cd ..
          echo "📦 Created package: android-emulator-skill-${{ github.ref_name }}.zip"
          ls -lh android-emulator-skill-${{ github.ref_name }}.zip

      - name: Upload package to release
        uses: softprops/action-gh-release@v2
        with:
          files: android-emulator-skill-${{ github.ref_name }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Release summary
        run: |
          echo "## 🎉 Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** android-emulator-skill-${{ github.ref_name }}.zip" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation (Claude Code plugin)" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Add this repo as a marketplace, then install the plugin:" >> $GITHUB_STEP_SUMMARY
          echo "claude plugin marketplace add ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "claude plugin install android-emulator-skill@fluxxion82" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
